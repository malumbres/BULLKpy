version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Tutorial notebooks live in notebooks/ and are copied into the docs tree
      # at build time (docs/notebooks/*.ipynb is generated, not tracked).
      - mkdir -p docs/notebooks
      - find docs/notebooks -type f -name "*.ipynb" ! -name "index.ipynb" -delete
      - cp notebooks/*.ipynb docs/notebooks/ || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
