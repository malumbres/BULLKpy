[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bullkpy"
version = "0.3.0"
description = "Scanpy-like pipeline for bulk RNA-seq in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Marcos Malumbres", email = "mmalumbres@vhio.net" }]
keywords = ["bulk-rnaseq", "tcga", "anndata", "scanpy", "bioinformatics"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy",
  "pandas>=2.0",
  "scipy",
  "matplotlib>=3.9",
  "anndata",
  "seaborn>=0.13",
  "scikit-learn",
  "statsmodels",
  "gseapy",
  "lifelines",
  "openpyxl",
  "lxml",                         # gseapy MSigDB utilities
  "umap-learn>=0.5.7",            # bk.tl.umap
  "numba>=0.60",
  "igraph",                       # bk.tl.cluster(method="leiden")
  "leidenalg",
  "networkx",                     # GSEA leading-edge / enrichment-map networks
]

[project.optional-dependencies]
# umap, leiden and network are installed by default since 0.3.0; the names stay so that
# `pip install "bullkpy[umap,leiden]"` from older instructions keeps working.
umap = []
leiden = []
network = []
survival-ml = ["scikit-survival"]   # pl.time_dependent_roc
notebook = ["ipykernel", "jupyterlab"]
dev = ["pytest", "ruff", "black", "build", "twine", "nbformat", "nbclient", "ipykernel"]
docs = [
  "sphinx>=7,<8",
  "pydata-sphinx-theme>=0.15",
  "myst-parser>=2,<4",
  "myst-nb>=1.1,<1.3",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "ipython",
]

[project.urls]
Homepage = "https://github.com/malumbres/BULLKpy"
Repository = "https://github.com/malumbres/BULLKpy"
Issues = "https://github.com/malumbres/BULLKpy/issues"
Documentation = "https://bullkpy.readthedocs.io/en/latest/index.html"
Changelog = "https://github.com/malumbres/BULLKpy/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
bullkpy = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # line length handled by formatter
  "E741",   # ambiguous variable names (l, I) are common in stats code
  "B008",   # function call in default arg
  "B905",   # zip() without strict=

]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.black]
line-length = 100
target-version = ["py310"]
